[project]
name = "qa-studio-backend"
version = "0.1.0"
description = "QA Studio API: AI-native QA workspace backend."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.15"
# Ranges only. Exact, reproducible versions live in requirements.lock /
# requirements-dev.lock (generated by scripts/lock_backend.sh).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-auth>=2.30",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pixeltable-pgserver>=0.7",   # maintained pgserver fork: embedded PostgreSQL wheels for cp310-cp314
    # Git-hook runner for developer machines only. Its dependency chain (virtualenv ->
    # filelock) has no security-patched release for Python 3.10, so it is not installed
    # there; tests, ruff and mypy do not need it.
    "pre-commit>=4.7; python_version >= '3.11'",
    "detect-secrets>=1.5",
]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
# The app is imported from the source tree; no package install is needed.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

# ------------------------------------------------------------------ ruff
[tool.ruff]
target-version = "py310"   # keep syntax valid on the oldest supported Python
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is how pytest works

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
